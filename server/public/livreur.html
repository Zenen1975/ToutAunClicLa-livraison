const money=c=>new Intl.NumberFormat(lang==='es'?'es-CA':'fr-CA',{style:'currency',currency:'CAD'}).format(c/100)+' CAD';
const $=id=>document.getElementById(id);let lang=navigator.language.startsWith('es')?'es':'fr';let token='',shiftId='',epoch=0,gpsTimer,pollTimer,tracking=false,stopPending=false,busy=false,locating=false,refreshing=false,jobs=[],lastSent=0,lastAccuracy=0,lastSync=0,gpsState='offline';
let jingleAudio=null,audioEnabled=false,soundBlocked=false,alarmTimer=null,soundEpoch=0;const seenAssignments=new Set(),pendingAssignments=new Set();
let wakeLock=null,wakePending=false;
function renderScreen(){$('screenStatus').textContent=tracking&&$('keepScreen').checked?t(wakeLock&&!wakeLock.released?'screenOn':'screenOff'):''}
async function keepAwake(){if(!tracking||!$('keepScreen').checked||document.hidden||wakeLock||wakePending)return;if(!navigator.wakeLock){renderScreen();return}wakePending=true;const current=epoch;try{const lock=await navigator.wakeLock.request('screen');if(current!==epoch||!tracking||!$('keepScreen').checked||document.hidden){await lock.release();return}wakeLock=lock;lock.addEventListener('release',()=>{if(wakeLock===lock)wakeLock=null;renderScreen()})}catch{}finally{wakePending=false;renderScreen()}}
function releaseScreen(){const lock=wakeLock;wakeLock=null;if(lock)lock.release().catch(()=>{});renderScreen()}
const t=k=>words[lang][k]||k;
function message(text=''){$('error').textContent=text}
function localize(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$('language').textContent=lang==='fr'?'ES':'FR';renderStatus();renderJobs();renderSync();renderScreen();renderAlarm()}
function renderSync(){$('sync').textContent=lastSync?t('updated')+new Date(lastSync).toLocaleTimeString():''}
function renderStatus(){const fresh=tracking&&lastSent&&Date.now()-lastSent<60000;const state=stopPending?'stale':tracking?(fresh?'online':gpsState==='waiting'?'waiting':'stale'):'offline';$('status').textContent=t(state);$('status').className='status '+(state==='online'?'good':state==='stale'?'warning':'');$('start').classList.toggle('hidden',tracking||stopPending);$('stop').classList.toggle('hidden',!tracking&&!stopPending);$('consentLabel').classList.toggle('hidden',tracking||stopPending);$('gps').textContent=stopPending?t('stopPending'):tracking&&lastSent?t('last')+new Date(lastSent).toLocaleTimeString()+' · '+t('accuracy')+': '+Math.round(lastAccuracy)+' m':''}
function renderAlarm(){const pending=pendingAssignments.size;$('assignmentAlert').classList.toggle('hidden',!pending);$('assignmentCount').textContent=t('assignmentCount')+pending;$('soundStatus').textContent=t(soundBlocked?'soundBlocked':audioEnabled?'soundReady':'soundInactive');$('disableSound').classList.toggle('hidden',!audioEnabled);document.title=pending?'🔔 '+t('newAssignment'):'ToutAunClicLa · '+t('space')}
function stopJingle(){if(jingleAudio){jingleAudio.pause();jingleAudio.currentTime=0}}
function silenceAlarm(){clearInterval(alarmTimer);alarmTimer=null;soundEpoch++;stopJingle()}
function disableAudio(){audioEnabled=false;soundBlocked=false;silenceAlarm();renderAlarm()}
async function playJingle(){
  if(!audioEnabled||!jingleAudio)return false;
  stopJingle();
  const current=++soundEpoch;
  try{
    await jingleAudio.play();
    if(current!==soundEpoch)return false;
    soundBlocked=false;renderAlarm();return true;
  }catch{
    if(current===soundEpoch){soundBlocked=true;renderAlarm()}
    return false;
  }
}
function repeatAlarm(){if(pendingAssignments.size&&token)void playJingle();else silenceAlarm()}
function beginAlarm(){if(!pendingAssignments.size||!audioEnabled||alarmTimer!==null)return;void playJingle();alarmTimer=setInterval(repeatAlarm,15000)}
async function enableAudio(){
  const button=$('enableSound');button.disabled=true;
  try{
    if(!jingleAudio){
      jingleAudio=new window.Audio('/assignment-jingle.mp3');
      jingleAudio.preload='auto';
      jingleAudio.addEventListener('error',()=>{if(audioEnabled){soundBlocked=true;renderAlarm()}});
    }
    silenceAlarm();audioEnabled=true;soundBlocked=false;
    if(await playJingle()){
      if(pendingAssignments.size&&audioEnabled)alarmTimer=setInterval(repeatAlarm,15000);
    }else if(audioEnabled){audioEnabled=false;renderAlarm()}
  }catch{audioEnabled=false;soundBlocked=true;renderAlarm()}
  finally{button.disabled=false}
}
function detectAssignments(){const assigned=new Set(jobs.filter(d=>d.status==='assigned').map(d=>d.id));for(const id of assigned)if(!seenAssignments.has(id)){seenAssignments.add(id);pendingAssignments.add(id)}for(const id of pendingAssignments)if(!assigned.has(id))pendingAssignments.delete(id);if(!pendingAssignments.size)silenceAlarm();else beginAlarm();renderAlarm()}
async function api(path,method='GET',body,auth=token){let r;try{r=await fetch(path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+auth},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(15000)})}catch{throw Error(t('network'))}const data=await r.json();if(!r.ok){if(r.status===401&&path!='/login'){reset();throw Error(t('expired'))}const e=Error(data.error||t('network'));e.status=r.status;throw e}return data}
function clearGps(){disableAudio();tracking=false;releaseScreen();epoch++;clearInterval(gpsTimer);lastSent=0;locating=false}
function reset(){clearGps();seenAssignments.clear();pendingAssignments.clear();renderAlarm();clearInterval(pollTimer);token='';shiftId='';stopPending=false;jobs=[];lastSync=0;$('consent').checked=false;$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');renderStatus()}
async function run(button,fn){if(busy)return;busy=true;button.disabled=true;message();try{await fn()}catch(e){message(e.message)}finally{busy=false;button.disabled=false}}
function mapLink(label,destination,{waypoint='',navigate=false,primary=false}={}){
  const link=document.createElement('a');
  link.className='route'+(primary?' primary':'');
  link.textContent=t(label);
  link.href='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(destination);
  // Omit origin so Google Maps can use the driver's current location.
  if(waypoint)link.href+='&waypoints='+encodeURIComponent(waypoint);
  if(navigate)link.href+='&dir_action=navigate';
  link.target='_blank';link.rel='noopener noreferrer';
  return link;
}
function renderJobs(){const list=$('jobs');list.replaceChildren();const active=jobs.filter(d=>d.status!=='delivered');if(!active.length){const p=document.createElement('p');p.textContent=t('empty');p.className='muted';list.append(p);return}const groups=new Map();for(const d of active){if(d.batch_id){if(!groups.has(d.batch_id))groups.set(d.batch_id,[]);groups.get(d.batch_id).push(d)}}
for(const [batchId,batchJobs] of groups){if(batchJobs.length<2)continue;batchJobs.sort((a,b)=>a.created_at-b.created_at||a.id.localeCompare(b.id));const card=document.createElement('article');card.className='job';const title=document.createElement('h2');title.textContent=t('batchTitle')+' · '+batchJobs.length;card.append(title);
const help=document.createElement('p');help.textContent=t('batchHelp');card.append(help);
for(const [i,d]of batchJobs.entries()){const line=document.createElement('p');line.textContent=(i+1)+'. '+(d.request_reference||'')+' · '+d.destination;card.append(line)}
const destinations=batchJobs.map(d=>d.destination),pendingPickup=batchJobs.some(d=>d.status==='assigned'),waypoints=[...(pendingPickup?[batchJobs[0].pickup]:[]),...destinations.slice(0,-1)];card.append(mapLink('batchMap',destinations.at(-1),{waypoint:waypoints.join('|'),primary:true}));
if(batchJobs.every(d=>d.driver_payout_cents!=null)){const amount=document.createElement('p');amount.textContent=t('batchPayout')+': '+money(batchJobs.reduce((total,d)=>total+d.driver_payout_cents,0));card.append(amount)}
if(batchJobs.every(d=>d.status==='assigned')){const collect=document.createElement('button');collect.textContent=t('batchCollect');collect.onclick=()=>run(collect,async()=>{await api('/batches/'+batchId+'/pickup','POST',{});await refresh()});card.append(collect)}list.append(card)}
for(const d of active){const card=document.createElement('article');card.className='job';const badge=document.createElement('span');badge.className='status';badge.textContent=t(d.status);card.append(badge);if(d.request_reference){const reference=document.createElement('strong');reference.textContent=d.request_reference;card.append(reference)}
if(d.total_price_cents!=null){for(const [label,value]of [['deliveryPrice',d.delivery_fare_cents??d.total_price_cents],['tip',d.tip_cents||0],['commission',d.commission_cents],['payout',d.driver_payout_cents]]){const p=document.createElement('p');p.textContent=t(label)+': '+money(value);if(label==='payout')p.style.fontWeight='700';card.append(p)}}else{const p=document.createElement('p');p.textContent=t('noPrice');card.append(p)}
for(const [key,value]of [['pickup',d.pickup],['destination',d.destination]]){const label=document.createElement('strong');label.textContent=t(key);const p=document.createElement('p');p.textContent=value;card.append(label,p)}
for(const [key,value]of [['requestContact',d.contact_name?d.contact_name+' · '+d.contact_phone:''],['recipientContact',d.recipient_name?d.recipient_name+' · '+d.recipient_phone:''],['requestContents',d.item_description],['requestNotes',d.notes],['requestReady',d.ready_at?new Date(d.ready_at).toLocaleString(lang,{timeZone:'America/Toronto'}):'']]){if(value){const p=document.createElement('p');p.textContent=t(key)+': '+value;card.append(p)}}
if(d.status==='assigned'){
  card.append(mapLink('mapFull',d.destination,{waypoint:d.pickup,primary:true}));
  card.append(mapLink('mapPickup',d.pickup,{navigate:true}));
}
card.append(mapLink('mapDelivery',d.destination,{navigate:true,primary:d.status!=='assigned'}));
const help=document.createElement('p');help.className='muted';help.textContent=t('mapHelp');card.append(help);const button=document.createElement('button');button.textContent=t(d.status==='assigned'?'collected':'delivered');button.onclick=()=>run(button,async()=>{await api('/deliveries/'+d.id,'PATCH',{status:d.status==='assigned'?'picked_up':'delivered'});await refresh()});if(!(d.status==='assigned'&&(groups.get(d.batch_id)?.length||0)>1&&groups.get(d.batch_id).every(job=>job.status==='assigned')))card.append(button);list.append(card)}}
async function refresh(){if(!token||refreshing)return;refreshing=true;const auth=token;try{const data=await api('/deliveries');if(token!==auth)return;jobs=data;detectAssignments();lastSync=Date.now();renderJobs();renderSync();renderScreen();renderAlarm()}catch(e){$('sync').textContent=t('network');message(e.message)}finally{refreshing=false}}
async function stopShift(){clearGps();stopPending=!!shiftId;renderStatus();if(!shiftId)return;await api('/shift/stop','POST',{});shiftId='';stopPending=false;$('consent').checked=false;renderStatus()}
function getPosition(){return new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,maximumAge:0,timeout:15000}))}
async function locate(){if(!tracking||locating||document.hidden)return;locating=true;const current=epoch,id=shiftId;try{let p;try{p=await getPosition()}catch(e){if(current!==epoch)return;gpsState='stale';if(e.code===1){await stopShift();throw Error(t('denied'))}throw Error(t('gpsError'))}if(current!==epoch||!tracking)return;await api('/location','POST',{shiftId:id,latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,measuredAt:p.timestamp});if(current!==epoch||!tracking)return;lastSent=Date.now();lastAccuracy=p.coords.accuracy;gpsState='online';message()}catch(e){if(current===epoch){gpsState='stale';if(e.status===409){clearGps();shiftId='';stopPending=false;$('consent').checked=false}message(e.message)}else if(e.message===t('denied'))message(e.message)}finally{if(current===epoch)locating=false;renderStatus()}}
$('loginForm').onsubmit=e=>{e.preventDefault();run(e.currentTarget.querySelector('button'),async()=>{const result=await api('/login','POST',{email:$('email').value,password:$('password').value});if(result.user.role!=='driver'){await api('/logout','POST',{},result.token);throw Error(t('driverOnly'))}token=result.token;$('password').value='';$('name').textContent=result.user.name;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await refresh();pollTimer=setInterval(()=>{refresh();renderStatus()},12000)})};
$('start').onclick=()=>run($('start'),async()=>{if(!$('consent').checked)throw Error(t('needConsent'));if(!navigator.geolocation)throw Error(t('unsupported'));const s=await api('/shift/start','POST',{consent:true});shiftId=s.shiftId;tracking=true;epoch++;gpsState='waiting';renderStatus();keepAwake();gpsTimer=setInterval(locate,20000);await locate()});
$('stop').onclick=()=>run($('stop'),stopShift);
$('logout').onclick=()=>run($('logout'),async()=>{clearGps();stopPending=!!shiftId;renderStatus();await api('/logout','POST',{});reset()});
$('enableSound').onclick=enableAudio;$('disableSound').onclick=disableAudio;$('acknowledge').onclick=()=>{pendingAssignments.clear();silenceAlarm();renderAlarm()};
$('keepScreen').onchange=()=>{if($('keepScreen').checked)keepAwake();else releaseScreen()};
$('refresh').onclick=()=>refresh();$('language').onclick=()=>{lang=lang==='fr'?'es':'fr';localize()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){keepAwake();locate();refresh();renderStatus()}else{releaseScreen()}});
window.addEventListener('pagehide',()=>{clearGps();if(token&&shiftId){fetch('/shift/stop',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:'{}',keepalive:true}).catch(()=>{});shiftId=''}});
localize();
</script></body></html>
