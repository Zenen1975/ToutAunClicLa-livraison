<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#292239;font:16px system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #e8e2f0;padding:20px max(20px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{color:#572794;display:block;font-size:20px}small,.muted{color:#726980}main{max-width:640px;margin:auto;padding:24px 18px calc(32px + env(safe-area-inset-bottom))}.card{background:white;border:1px solid #e8e2f0;border-radius:20px;padding:24px;margin:0 0 20px}h1{font-size:26px;margin:0 0 10px}h2{font-size:21px;margin:0 0 16px}p{line-height:1.55}form{display:grid;gap:12px}input,button,.route{font:inherit;border-radius:12px;padding:14px;min-height:48px}input{width:100%;border:1px solid #d7cce5;background:white}button{border:0;background:#6332a0;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#eee7f7;color:#572794}.wide{width:100%}a{color:#6332a0}.hidden{display:none!important}.consent{display:flex;align-items:flex-start;gap:12px;line-height:1.5;margin:20px 0}.consent input{width:22px;min-height:22px;flex-shrink:0;margin:2px 0;accent-color:#6332a0}.notice{background:#f5f0fb;border-radius:12px;padding:14px;font-size:14px}.status{display:inline-block;border-radius:30px;background:#eee7f7;padding:8px 12px;font-size:14px;font-weight:650}.good{background:#e5f6ed;color:#1c7147}.warning{background:#fff1dd;color:#8a591c}#error{color:#a02b39;white-space:pre-wrap;line-height:1.5;margin-bottom:16px}#error:empty{display:none}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.job{border-top:1px solid #eee7f7;padding-top:18px;margin-top:18px;overflow-wrap:anywhere}.job p{margin:8px 0 16px}.job strong{display:block}.route{display:block;background:#eee7f7;text-align:center;text-decoration:none;margin-bottom:12px}.job button{width:100%}.footer{display:block;text-align:center;font-size:14px}button:f <section id="login" class="card"><h1 data-i18n="welcome"></h1><p class="muted" data-i18n="intro"></p><form id="loginForm"><label for="email" data-i18n="email"></label><input id="email" type="email" autocomplete="username" required><label for="password" data-i18n="password"></label><input id="password" type="password" autocomplete="current-password" required><button data-i18n="signIn"></button></form><p class="notice" data-i18n="account"></p></section>

<a href="/" class="footer" data-i18n="admin"></a></main>
<script>
'use strict';
const words={fr:{space:'Espace livreur',welcome:'Votre prochaine livraison commence ici.',intro:'Connectez-vous avec le compte créé par votre administrateur.',email:'Courriel',password:'Mot de passe',signIn:'Se connecter',account:'Pas encore de compte ? Demandez à ToutAunClicLa de créer votre accès livreur.',logout:'Se déconnecter',shift:'Mon service',foreground:'Gardez cette page ouverte et l’écran allumé pour partager votre position. Le suivi peut s’interrompre si vous changez d’application ou verrouillez le téléphone.',consent:'J’autorise le partage de ma position avec ToutAunClicLa pendant mon service pour organiser les livraisons. Je peux arrêter le partage en terminant mon service.',start:'Commencer mon service',stop:'Terminer mon service',deliveries:'Mes livraisons',refresh:'Actualiser',admin:'Accès administrateur',offline:'Hors ligne',waiting:'Recherche du GPS…',online:'Position partagée',stale:'GPS non actualisé',last:'Dernière position envoyée à ',accuracy:'Précision',empty:'Aucune livraison en cours. Votre administrateur vous assignera une livraison lorsque votre GPS sera actif.',pickup:'Collecte',destination:'Livraison',assigned:'À récupérer',picked_up:'En livraison',collected:'Confirmer la collecte',delivered:'Confirmer la livraison',route:'Ouvrir l’itinéraire dans Google Maps',needConsent:'Autorisez le partage de position pour commencer.',denied:'Localisation refusée. Autorisez la localisation pour ce site dans les réglages du navigateur, puis recommencez.',gpsError:'Position indisponible. Vérifiez la localisation et réessayez.',unsupported:'Ce navigateur ne permet pas la localisation. Ouvrez cette page dans Safari ou Chrome.',driverOnly:'Ce compte est administrateur. Utilisez le lien « Accès administrateur » en bas de page.',network:'Connexion interrompue. Vérifiez Internet et réessayez.',updated:'Actualisé à ',stopPending:'Le GPS est arrêté sur ce téléphone, mais le serveur n’a pas confirmé la fin du service. Réessayez avec le bouton ci-dessous.',expired:'Votre session a expiré. Reconnectez-vous.'},es:{space:'Acceso repartidores',welcome:'Tu próxima entrega empieza aquí.',intro:'Ingresa con la cuenta creada por tu administrador.',email:'Correo',password:'Contraseña',signIn:'Iniciar sesión',account:'¿Todavía no tienes cuenta? Pide a ToutAunClicLa que cree tu acceso de repartidor.',logout:'Cerrar sesión',shift:'Mi turno',foreground:'Mantén esta página abierta y la pantalla encendida para compartir tu ubicación. El seguimiento puede interrumpirse si cambias de aplicación o bloqueas el teléfono.',consent:'Autorizo compartir mi ubicación con ToutAunClicLa durante mi turno para organizar las entregas. Puedo detener el seguimiento al terminar mi turno.',start:'Comenzar mi turno',stop:'Terminar mi turno',deliveries:'Mis entregas',refresh:'Actualizar',admin:'Acceso administrador',offline:'Desconectado',waiting:'Buscando GPS…',online:'Ubicación compartida',stale:'GPS desactualizado',last:'Última ubicación enviada a las ',accuracy:'Precisión',empty:'No tienes entregas pendientes. Tu administrador te asignará una entrega cuando tu GPS esté activo.',pickup:'Recogida',destination:'Entrega',assigned:'Por recoger',picked_up:'En entrega',collected:'Confirmar recogida',delivered:'Confirmar entrega',route:'Abrir ruta en Google Maps',needConsent:'Autoriza compartir tu ubicación para comenzar.',denied:'Ubicación denegada. Permite la ubicación para este sitio en los ajustes del navegador y vuelve a intentarlo.',gpsError:'Ubicación no disponible. Revisa la localización y vuelve a intentarlo.',unsupported:'Este navegador no permite la ubicación. Abre esta página en Safari o Chrome.',driverOnly:'Esta cuenta es de administrador. Usa el enlace « Acceso administrador » al final de la página.',network:'Conexión interrumpida. Revisa Internet y vuelve a intentarlo.',updated:'Actualizado a las ',stopPending:'El GPS se detuvo en este teléfono, pero el servidor no confirmó el fin del turno. Vuelve a intentarlo con el botón de abajo.',expired:'Tu sesión terminó. Vuelve a iniciar sesión.'}};
words.fr.keepScreen='Garder l’écran allumé pendant mon service';words.fr.screenOn='Écran maintenu allumé pendant le service.';words.fr.screenOff='Maintien de l’écran indisponible ou interrompu. Vérifiez le verrouillage automatique du téléphone.';words.es.keepScreen='Mantener la pantalla encendida durante mi turno';words.es.screenOn='Pantalla encendida durante el turno.';words.es.screenOff='No se pudo mantener la pantalla encendida. Revisa el bloqueo automático del teléfono.';
Object.assign(words.fr,{newAssignment:'Nouvelle livraison assignée',understood:'Compris',soundTitle:'Alertes sonores',soundHelp:'Activez et testez le son à chaque connexion. Gardez la page ouverte ; vérifiez le volume du téléphone. Le son peut être interrompu en arrière-plan.',enableSound:'Activer et tester le son',disableSound:'Désactiver le son',soundReady:'Son activé. Vérifiez que vous avez entendu le test.',soundInactive:'Son désactivé. Les alertes visuelles restent actives.',soundBlocked:'Son interrompu ou indisponible. Appuyez sur « Activer et tester le son » et vérifiez le volume.',assignmentCount:'Livraison(s) à consulter : '});
Object.assign(words.es,{newAssignment:'Nueva entrega asignada',understood:'Entendido',soundTitle:'Alertas sonoras',soundHelp:'Activa y prueba el sonido cada vez que ingreses. Mantén la página abierta y revisa el volumen del teléfono. El sonido puede interrumpirse en segundo plano.',enableSound:'Activar y probar sonido',disableSound:'Desactivar sonido',soundReady:'Sonido activado. Comprueba que escuchaste la prueba.',soundInactive:'Sonido desactivado. Los avisos visuales siguen activos.',soundBlocked:'Sonido interrumpido o no disponible. Toca « Activar y probar sonido » y revisa el volumen.',assignmentCount:'Entregas por revisar: '});
const $=id=>document.getElementById(id);let lang=navigator.language.startsWith('es')?'es':'fr';let token='',shiftId='',epoch=0,gpsTimer,pollTimer,tracking=false,stopPending=false,busy=false,locating=false,refreshing=false,jobs=[],lastSent=0,lastAccuracy=0,lastSync=0,gpsState='offline';
let audioContext=null,audioEnabled=false,soundBlocked=false,alarmTimer=null,toneNodes=[],soundEpoch=0;const seenAssignments=new Set(),pendingAssignments=new Set();
let wakeLock=null,wakePending=false;
function renderScreen(){$('screenStatus').textContent=tracking&&$('keepScreen').checked?t(wakeLock&&!wakeLock.released?'screenOn':'screenOff'):''}
async function keepAwake(){if(!tracking||!$('keepScreen').checked||document.hidden||wakeLock||wakePending)return;if(!navigator.wakeLock){renderScreen();return}wakePending=true;const current=epoch;try{const lock=await navigator.wakeLock.request('screen');if(current!==epoch||!tracking||!$('keepScreen').checked||document.hidden){await lock.release();return}wakeLock=lock;lock.addEventListener('release',()=>{if(wakeLock===lock)wakeLock=null;renderScreen()})}catch{}finally{wakePending=false;renderScreen()}}
function releaseScreen(){const lock=wakeLock;wakeLock=null;if(lock)lock.release().catch(()=>{});renderScreen()}
const t=k=>words[lang][k]||k;
function message(text=''){$('error').textContent=text}
function localize(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$('language').textContent=lang==='fr'?'ES':'FR';renderStatus();renderJobs();renderSync();renderScreen();renderAlarm()}
function renderSync(){$('sync').textContent=lastSync?t('updated')+new Date(lastSync).toLocaleTimeString():''}
function renderStatus(){const fresh=tracking&&lastSent&&Date.now()-lastSent<60000;const state=stopPending?'stale':tracking?(fresh?'online':gpsState==='waiting'?'waiting':'stale'):'offline';$('status').textContent=t(state);$('status').className='status '+(state==='online'?'good':state==='stale'?'warning':'');$('start').classList.toggle('hidden',tracking||stopPending);$('stop').classList.toggle('hidden',!tracking&&!stopPending);$('consentLabel').classList.toggle('hidden',tracking||stopPending);$('gps').textContent=stopPending?t('stopPending'):tracking&&lastSent?t('last')+new Date(lastSent).toLocaleTimeString()+' · '+t('accuracy')+': '+Math.round(lastAccuracy)+' m':''}
function renderAlarm(){const pending=pendingAssignments.size;$('assignmentAlert').classList.toggle('hidden',!pending);$('assignmentCount').textContent=t('assignmentCount')+pending;$('soundStatus').textContent=t(soundBlocked?'soundBlocked':audioEnabled?'soundReady':'soundInactive');$('disableSound').classList.toggle('hidden',!audioEnabled);document.title=pending?'🔔 '+t('newAssignment'):'ToutAunClicLa · '+t('space')}
function stopTones(){for(const n of toneNodes){try{n.stop();n.disconnect()}catch{}}toneNodes=[]}
function silenceAlarm(){clearInterval(alarmTimer);alarmTimer=null;stopTones()}
function disableAudio(){soundEpoch++;audioEnabled=false;soundBlocked=false;silenceAlarm();const context=audioContext;audioContext=null;if(context)context.close().catch(()=>{});renderAlarm()}
function playTone(){if(!audioEnabled||!audioContext)return;if(audioContext.state!=='running'){soundBlocked=true;renderAlarm();return}try{stopTones();const now=audioContext.currentTime;for(let repeat=0;repeat<2;repeat++)for(let i=0;i<3;i++){const o=audioContext.createOscillator(),g=audioContext.createGain(),at=now+repeat*0.9+i*0.22;o.type='sine';o.frequency.value=[660,880,1046][i];g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(0.18,at+0.02);g.gain.linearRampToValueAtTime(0,at+0.18);o.connect(g);g.connect(audioContext.destination);o.start(at);o.stop(at+0.2);o.onended=()=>{o.disconnect();g.disconnect()};toneNodes.push(o)}soundBlocked=false}catch{soundBlocked=true}renderAlarm()}
function beginAlarm(){if(!pendingAssignments.size||!audioEnabled||alarmTimer!==null)return;playTone();alarmTimer=setInterval(()=>{if(pendingAssignments.size&&token)playTone();else silenceAlarm()},8000)}
async function enableAudio(){const button=$('enableSound');button.disabled=true;const current=soundEpoch;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('audio unavailable');if(!audioContext){audioContext=new Audio();const created=audioContext;created.onstatechange=()=>{if(audioContext===created&&audioEnabled){soundBlocked=created.state!=='running';renderAlarm()}}}const context=audioContext;await context.resume();if(current!==soundEpoch||audioContext!==context)return;if(context.state!=='running')throw Error('audio blocked');audioEnabled=true;soundBlocked=false;silenceAlarm();playTone();if(pendingAssignments.size)alarmTimer=setInterval(()=>{if(pendingAssignments.size&&token)playTone();else silenceAlarm()},8000)}catch{if(current===soundEpoch){audioEnabled=false;soundBlocked=true;renderAlarm()}}finally{button.disabled=false}}
function detectAssignments(){const assigned=new Set(jobs.filter(d=>d.status==='assigned').map(d=>d.id));for(const id of assigned)if(!seenAssignments.has(id)){seenAssignments.add(id);pendingAssignments.add(id)}for(const id of pendingAssignments)if(!assigned.has(id))pendingAssignments.delete(id);if(!pendingAssignments.size)silenceAlarm();else beginAlarm();renderAlarm()}
async function api(path,method='GET',body,auth=token){let r;try{r=await fetch(path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+auth},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(15000)})}catch{throw Error(t('network'))}const data=await r.json();if(!r.ok){if(r.status===401&&path!='/login'){reset();throw Error(t('expired'))}const e=Error(data.error||t('network'));e.status=r.status;throw e}return data}
function clearGps(){disableAudio();tracking=false;releaseScreen();epoch++;clearInterval(gpsTimer);lastSent=0;locating=false}
function reset(){clearGps();seenAssignments.clear();pendingAssignments.clear();renderAlarm();clearInterval(pollTimer);token='';shiftId='';stopPending=false;jobs=[];lastSync=0;$('consent').checked=false;$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');renderStatus()}
async function run(button,fn){if(busy)return;busy=true;button.disabled=true;message();try{await fn()}catch(e){message(e.message)}finally{busy=false;button.disabled=false}}
function renderJobs(){const list=$('jobs');list.replaceChildren();const active=jobs.filter(d=>d.status!=='delivered');if(!active.length){const p=document.createElement('p');p.textContent=t('empty');p.className='muted';list.append(p);return}for(const d of active){const card=document.createElement('article');card.className='job';const badge=document.createElement('span');badge.className='status';badge.textContent=t(d.status);card.append(badge);for(const [key,value]of [['pickup',d.pickup],['destination',d.destination]]){const label=document.createElement('strong');label.textContent=t(key);const p=document.createElement('p');p.textContent=value;card.append(label,p)}const route=document.createElement('a');route.className='route';route.textContent=t('route');route.href='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(d.status==='assigned'?d.pickup:d.destination);route.target='_blank';route.rel='noopener noreferrer';card.append(route);const button=document.createElement('button');button.textContent=t(d.status==='assigned'?'collected':'delivered');button.onclick=()=>run(button,async()=>{await api('/deliveries/'+d.id,'PATCH',{status:d.status==='assigned'?'picked_up':'delivered'});await refresh()});card.append(button);list.append(card)}}
async function refresh(){if(!token||refreshing)return;refreshing=true;const auth=token;try{const data=await api('/deliveries');if(token!==auth)return;jobs=data;detectAssignments();lastSync=Date.now();renderJobs();renderSync();renderScreen();renderAlarm()}catch(e){$('sync').textContent=t('network');message(e.message)}finally{refreshing=false}}
async function stopShift(){clearGps();stopPending=!!shiftId;renderStatus();if(!shiftId)return;await api('/shift/stop','POST',{});shiftId='';stopPending=false;$('consent').checked=false;renderStatus()}
function getPosition(){return new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,maximumAge:0,timeout:15000}))}
async function locate(){if(!tracking||locating||document.hidden)return;locating=true;const current=epoch,id=shiftId;try{let p;try{p=await getPosition()}catch(e){if(current!==epoch)return;gpsState='stale';if(e.code===1){await stopShift();throw Error(t('denied'))}throw Error(t('gpsError'))}if(current!==epoch||!tracking)return;await api('/location','POST',{shiftId:id,latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,measuredAt:p.timestamp});if(current!==epoch||!tracking)return;lastSent=Date.now();lastAccuracy=p.coords.accuracy;gpsState='online';message()}catch(e){if(current===epoch){gpsState='stale';if(e.status===409){clearGps();shiftId='';stopPending=false;$('consent').checked=false}message(e.message)}else if(e.message===t('denied'))message(e.message)}finally{if(current===epoch)locating=false;renderStatus()}}
$('loginForm').onsubmit=e=>{e.preventDefault();run(e.currentTarget.querySelector('button'),async()=>{const result=await api('/login','POST',{email:$('email').value,password:$('password').value});if(result.user.role!=='driver'){await api('/logout','POST',{},result.token);throw Error(t('driverOnly'))}token=result.token;$('password').value='';$('name').textContent=result.user.name;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await refresh();pollTimer=setInterval(()=>{refresh();renderStatus()},12000)})};
$('start').onclick=()=>run($('start'),async()=>{if(!$('consent').checked)throw Error(t('needConsent'));if(!navigator.geolocation)throw Error(t('unsupported'));const s=await api('/shift/start','POST',{consent:true});shiftId=s.shiftId;tracking=true;epoch++;gpsState='waiting';renderStatus();keepAwake();gpsTimer=setInterval(locate,20000);await locate()});
$('stop').onclick=()=>run($('stop'),stopShift);
$('logout').onclick=()=>run($('logout'),async()=>{clearGps();stopPending=!!shiftId;renderStatus();await api('/logout','POST',{});reset()});
$('enableSound').onclick=enableAudio;$('disableSound').onclick=disableAudio;$('acknowledge').onclick=()=>{pendingAssignments.clear();silenceAlarm();renderAlarm()};
$('keepScreen').onchange=()=>{if($('keepScreen').checked)keepAwake();else releaseScreen()};
$('refresh').onclick=()=>refresh();$('language').onclick=()=>{lang=lang==='fr'?'es':'fr';localize()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){keepAwake();locate();refresh();renderStatus()}else{releaseScreen()}});
window.addEventListener('pagehide',()=>{clearGps();if(token&&shiftId){fetch('/shift/stop',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:'{}',keepalive:true}).catch(()=>{});shiftId=''}});
localize();
</script></body></html>
