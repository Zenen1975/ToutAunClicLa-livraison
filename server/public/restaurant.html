<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ToutAunClicLa · Demander une livraison</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#292239;font:16px system-ui,sans-serif}main{max-width:700px;margin:40px auto;padding:0 20px}.card{background:white;border:1px solid #e8e2f0;border-radius:18px;padding:24px;margin:20px 0}h1{font-size:25px;color:#572794}h2{font-size:21px}form{display:grid;gap:12px}input,button,.button{font:inherit;padding:14px;border-radius:10px;min-height:48px}input{width:100%;border:1px solid #d7cce5}button,.button{background:#6332a0;border:0;color:white;font-weight:650;cursor:pointer}.button{display:inline-block;text-decoration:none}button:disabled{opacity:.6}.secondary{background:#eee7f7;color:#572794}a{color:#6332a0}.hidden{display:none!important}.message{white-space:pre-wrap;line-height:1.5}.job{border-top:1px solid #e8e2f0;padding:16px 0;overflow-wrap:anywhere}p{line-height:1.5}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}small{color:#726980}</style></head><body><main><div class="top"><strong>ToutAunClicLa</strong><button id="lang" class="secondary" type="button">ES</button></div><section id="login" class="card"><h1 data-i18n="title"></h1><form id="loginForm"><label for="email" data-i18n="email"></label><input id="email" type="email" autocomplete="username" required><label for="password" data-i18n="password"></label><input id="password" type="password" autocomplete="current-password" required><button id="signIn" data-i18n="signIn"></button></form><p><a href="/forgot-password" data-i18n="forgot"></a></p><p data-i18n="accountHelp"></p></section><p id="message" class="message" role="status"></p><section id="dashboard" class="hidden"><div class="top"><h1 id="name"></h1><button id="logout" class="secondary" data-i18n="logout"></button></div><p><a href="/demander?new=1" class="button" data-i18n="newRequest"></a></p><section class="card"><h2 data-i18n="pickupTitle"></h2><form id="profileForm"><label for="pickup" data-i18n="pickup"></label><input id="pickup" maxlength="500" required><label for="postal" data-i18n="postal"></label><input id="postal" maxlength="7" required><button id="save" data-i18n="save"></button></form></section><section class="card"><h2 data-i18n="history"></h2><p data-i18n="retention"></p><button id="refresh" class="secondary" data-i18n="refresh"></button><div id="history"></div></section></section><p><a href="/demander" data-i18n="publicForm"></a></p></main><script>const words={fr:{title:'Demander une livraison',email:'Courriel',password:'Mot de passe',signIn:'Se connecter',forgot:'Mot de passe oublié',accountHelp:'ToutAunClicLa crée votre compte pour demander des livraisons, pour une entreprise ou un particulier. Contactez notre service client pour obtenir votre accès.',logout:'Se déconnecter',newRequest:'Demander une livraison',pickupTitle:'Votre collecte habituelle',pickup:'Adresse complète de collecte',postal:'Code postal',save:'Enregistrer',saved:'Adresse de collecte enregistrée.',history:'Vos demandes de livraison',retention:'Les livraisons terminées restent visibles pendant 10 jours.',refresh:'Actualiser',empty:'Aucune demande.',wrongRole:'Utilisez votre compte de demandeur.',error:'Connexion interrompue. Réessayez.',pending:'En attente',assigned:'Un livreur est en route vers la collecte',picked_up:'En livraison',delivered:'Livrée',declined:'Refusée',publicForm:'Formulaire sans compte'},es:{title:'Solicitar una entrega',email:'Correo',password:'Contraseña',signIn:'Iniciar sesión',forgot:'Olvidé mi contraseña',accountHelp:'ToutAunClicLa crea tu cuenta para solicitar entregas como negocio o particular. Contacta a servicio al cliente para obtener tu acceso.',logout:'Cerrar sesión',newRequest:'Solicitar entrega',pickupTitle:'Tu recogida habitual',pickup:'Dirección completa de recogida',postal:'Código postal',save:'Guardar',saved:'Dirección de recogida guardada.',history:'Tus solicitudes de entrega',retention:'Las entregas completadas permanecen visibles durante 10 días.',refresh:'Actualizar',empty:'No hay solicitudes.',wrongRole:'Utiliza tu cuenta de solicitante.',error:'Conexión interrumpida. Reintenta.',pending:'Pendiente',assigned:'Un repartidor va en camino a la recogida',picked_up:'En reparto',delivered:'Entregada',declined:'Rechazada',publicForm:'Formulario sin cuenta'}};const $=id=>document.getElementById(id);let lang=navigator.language.startsWith('es')?'es':'fr';const t=k=>words[lang][k];function localize(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('lang').textContent=lang==='fr'?'ES':'FR'}$('lang').onclick=()=>{lang=lang==='fr'?'es':'fr';localize()};let token='',timer;try{token=sessionStorage.getItem('tacl-restaurant-session')||''}catch{}async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(15000)});const data=await r.json();if(!r.ok){if(r.status===401)signOut();throw Error(data.error||t('error'))}return data}function signOut(){token='';clearInterval(timer);try{sessionStorage.removeItem('tacl-restaurant-session')}catch{}$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');$('history').replaceChildren();$('profileForm').reset();$('name').textContent=''}async function refresh(){if(!token)return;try{const current=token,requests=await api('/restaurant/requests');if(token!==current)return;$('history').replaceChildren();if(!requests.length)$('history').textContent=t('empty');for(const r of requests){const card=document.createElement('article');card.className='job';for(const text of ['TAC-'+r.id.slice(0,12).toUpperCase()+' · '+(t(r.delivery_status||r.status)||r.status),r.pickup+' → '+r.destination,r.recipient_name,new Intl.NumberFormat(lang==='es'?'es-CA':'fr-CA',{style:'currency',currency:'CAD'}).format(r.total_cents/100),new Date(r.created_at).toLocaleString(lang==='es'?'es-CA':'fr-CA',{timeZone:'America/Toronto'})]){const line=document.createElement('p');line.textContent=text;card.append(line)}$('history').append(card)}}catch(e){$('message').textContent=e.message}}async function openAccount(){const current=token,profile=await api('/restaurant/profile');if(token!==current)return;$('name').textContent=profile.name;$('pickup').value=profile.pickup;$('postal').value=profile.pickupPostalCode;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await refresh();clearInterval(timer);timer=setInterval(refresh,12000)}$('loginForm').onsubmit=async e=>{e.preventDefault();$('signIn').disabled=true;$('message').textContent='';try{const result=await api('/login','POST',{email:$('email').value,password:$('password').value});if(result.user.role!=='restaurant'){await fetch('/logout',{method:'POST',headers:{Authorization:'Bearer '+result.token,'Content-Type':'application/json'},body:'{}'});throw Error(t('wrongRole'))}token=result.token;try{sessionStorage.setItem('tacl-restaurant-session',token)}catch{}$('password').value='';await openAccount()}catch(e){$('message').textContent=e.message}finally{$('signIn').disabled=false}};$('profileForm').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{await api('/restaurant/profile','PATCH',{pickup:$('pickup').value,pickupPostalCode:$('postal').value});$('message').textContent=t('saved')}catch(e){$('message').textContent=e.message}finally{$('save').disabled=false}};$('logout').onclick=async()=>{try{await api('/logout','POST',{})}finally{signOut()}};$('refresh').onclick=refresh;localize();if(token)openAccount().catch(e=>{signOut();$('message').textContent=e.message});</script></body></html>
