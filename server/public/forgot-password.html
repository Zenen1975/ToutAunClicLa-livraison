<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ToutAunClicLa · Mot de passe oublié</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#292239;font:16px system-ui,sans-serif}main{max-width:700px;margin:40px auto;padding:0 20px}.card{background:white;border:1px solid #e8e2f0;border-radius:18px;padding:24px;margin:20px 0}h1{font-size:25px;color:#572794}h2{font-size:21px}form{display:grid;gap:12px}input,button,.button{font:inherit;padding:14px;border-radius:10px;min-height:48px}input{width:100%;border:1px solid #d7cce5}button,.button{background:#6332a0;border:0;color:white;font-weight:650;cursor:pointer}.button{display:inline-block;text-decoration:none}button:disabled{opacity:.6}.secondary{background:#eee7f7;color:#572794}a{color:#6332a0}.hidden{display:none!important}.message{white-space:pre-wrap;line-height:1.5}.job{border-top:1px solid #e8e2f0;padding:16px 0;overflow-wrap:anywhere}p{line-height:1.5}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}small{color:#726980}body{line-height:1.6}input,select,textarea{font-size:16px}button,a,input,select,textarea{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #225ca8;outline-offset:3px}label:has(input[type=checkbox]){min-height:48px;display:flex;align-items:center;gap:12px}input[type=checkbox]{min-width:24px;min-height:24px}p,small{overflow-wrap:anywhere}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}</style></head><body><main><div class="top"><strong>ToutAunClicLa</strong><button id="lang" class="secondary" type="button">ES</button></div><section class="card"><h1 data-i18n="title"></h1><p data-i18n="help"></p><form id="form"><label for="email" data-i18n="email"></label><input id="email" type="email" autocomplete="email" maxlength="254" required><button id="send" data-i18n="send"></button></form><p id="message" class="message" role="status"></p></section><p><a href="/livreur" data-i18n="driver"></a> · <a href="/restaurant" data-i18n="restaurant"></a></p></main><script>function preferredLanguage(){try{const saved=localStorage.getItem('tacl-language');if(saved==='fr'||saved==='es')return saved}catch{}return typeof navigator!=='undefined'&&navigator.language?.startsWith('es')?'es':'fr'}function saveLanguage(value){try{localStorage.setItem('tacl-language',value)}catch{}}const words={fr:{title:'Mot de passe oublié',help:'Indiquez le courriel de votre compte. Vous recevrez un lien pour choisir un nouveau mot de passe.',email:'Courriel',send:'Recevoir le lien',success:'Si ce courriel correspond à un compte, un lien sera envoyé. Vérifiez aussi les indésirables. Le lien expire dans 30 minutes.',error:'Envoi non confirmé. Vérifiez Internet puis réessayez.',driver:'Accès livreur',restaurant:'Demander une livraison'},es:{title:'Olvidé mi contraseña',help:'Escribe el correo de tu cuenta. Recibirás un enlace para elegir una nueva contraseña.',email:'Correo',send:'Recibir enlace',success:'Si el correo corresponde a una cuenta, recibirás un enlace. Revisa también spam. El enlace vence en 30 minutos.',error:'No pudimos confirmar el envío. Revisa Internet y reintenta.',driver:'Acceso repartidores',restaurant:'Solicitar una entrega'}};const $=id=>document.getElementById(id);let lang=preferredLanguage();const t=k=>words[lang][k];function localize(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('lang').textContent=lang==='fr'?'Español':'Français'}$('lang').onclick=()=>{lang=lang==='fr'?'es':'fr';saveLanguage(lang);localize()};$('form').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;$('message').textContent='';try{const r=await fetch('/password/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value}),signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error();$('message').textContent=t('success')}catch{$('message').textContent=t('error')}finally{$('send').disabled=false}};localize();</script></body></html>
