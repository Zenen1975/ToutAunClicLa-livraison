<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ToutAunClicLa · Nouveau mot de passe</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#292239;font:16px system-ui,sans-serif}main{max-width:700px;margin:40px auto;padding:0 20px}.card{background:white;border:1px solid #e8e2f0;border-radius:18px;padding:24px;margin:20px 0}h1{font-size:25px;color:#572794}h2{font-size:21px}form{display:grid;gap:12px}input,button,.button{font:inherit;padding:14px;border-radius:10px;min-height:48px}input{width:100%;border:1px solid #d7cce5}button,.button{background:#6332a0;border:0;color:white;font-weight:650;cursor:pointer}.button{display:inline-block;text-decoration:none}button:disabled{opacity:.6}.secondary{background:#eee7f7;color:#572794}a{color:#6332a0}.hidden{display:none!important}.message{white-space:pre-wrap;line-height:1.5}.job{border-top:1px solid #e8e2f0;padding:16px 0;overflow-wrap:anywhere}p{line-height:1.5}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}small{color:#726980}</style></head><body><main><div class="top"><strong>ToutAunClicLa</strong><button id="lang" class="secondary" type="button">ES</button></div><section class="card"><h1 data-i18n="title"></h1><form id="form"><label for="password" data-i18n="password"></label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required><label for="confirm" data-i18n="confirm"></label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="200" required><button id="send" data-i18n="send"></button></form><p id="message" class="message" role="status"></p><p><a href="/forgot-password" data-i18n="again"></a></p></section><p><a href="/livreur" data-i18n="driver"></a> · <a href="/restaurant" data-i18n="restaurant"></a> · <a href="/">Administration</a></p></main><script>const words={fr:{title:'Choisir un nouveau mot de passe',password:'Nouveau mot de passe (12 caractères minimum)',confirm:'Confirmez le mot de passe',send:'Enregistrer le mot de passe',mismatch:'Les mots de passe ne correspondent pas.',invalid:'Lien invalide ou expiré. Demandez un nouveau lien.',success:'Votre mot de passe a été modifié. Reconnectez-vous avec le nouveau mot de passe.',error:'Modification non confirmée. Vérifiez Internet et réessayez.',again:'Recevoir un nouveau lien',driver:'Accès livreur',restaurant:'Accès restaurant'},es:{title:'Elige una nueva contraseña',password:'Nueva contraseña (mínimo 12 caracteres)',confirm:'Confirma la contraseña',send:'Guardar contraseña',mismatch:'Las contraseñas no coinciden.',invalid:'El enlace es inválido o venció. Solicita uno nuevo.',success:'Tu contraseña se cambió. Inicia sesión con la nueva contraseña.',error:'No pudimos confirmar el cambio. Revisa Internet y reintenta.',again:'Recibir un nuevo enlace',driver:'Acceso repartidores',restaurant:'Acceso restaurantes'}};const $=id=>document.getElementById(id);let lang=navigator.language.startsWith('es')?'es':'fr';const t=k=>words[lang][k];function localize(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('lang').textContent=lang==='fr'?'ES':'FR'}$('lang').onclick=()=>{lang=lang==='fr'?'es':'fr';localize()};let resetToken=location.hash.slice(1);history.replaceState(null,'','/reset-password');$('form').onsubmit=async e=>{e.preventDefault();if($('password').value!==$('confirm').value){$('message').textContent=t('mismatch');return}if(!/^[a-f0-9]{96}$/.test(resetToken)){$('message').textContent=t('invalid');return}$('send').disabled=true;try{const r=await fetch('/password/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:resetToken,password:$('password').value}),signal:AbortSignal.timeout(20000)});if(!r.ok){$('message').textContent=t('invalid');return}resetToken='';$('form').reset();$('form').classList.add('hidden');$('message').textContent=t('success')}catch{$('message').textContent=t('error')}finally{$('send').disabled=false}};localize();if(!/^[a-f0-9]{96}$/.test(resetToken)){$('message').textContent=t('invalid');$('send').disabled=true}</script></body></html>
