function uiText(key){const copy={fr:{help:'Besoin d’aide ?',adminAccess:'Administration',show:'Afficher le mot de passe',hide:'Masquer le mot de passe',passwordHelp:'Au moins 12 caractères. Choisissez une phrase facile à retenir.',required:'Remplissez ce champ.',email:'Indiquez une adresse courriel valide, par exemple nom@exemple.com.',postal:'Indiquez un code postal canadien, par exemple H2X 1Y4.',short:'Utilisez au moins 12 caractères.',invalid:'Vérifiez la valeur de ce champ.',failed:'Impossible de terminer. Vérifiez les informations et réessayez.',credentials:'Vérifiez votre courriel et votre mot de passe.',changed:'Les informations ont changé ou ont expiré. Actualisez puis réessayez.',wait:'Patientez un moment puis réessayez.'},es:{help:'Necesito ayuda',adminAccess:'Administración',show:'Mostrar contraseña',hide:'Ocultar contraseña',passwordHelp:'Mínimo 12 caracteres. Puedes usar una frase fácil de recordar.',required:'Completa este campo.',email:'Escribe un correo válido, por ejemplo nombre@ejemplo.com.',postal:'Escribe un código postal canadiense, por ejemplo H2X 1Y4.',short:'Usa al menos 12 caracteres.',invalid:'Revisa el contenido de este campo.',failed:'No pudimos terminar. Revisa los datos y vuelve a intentarlo.',credentials:'Revisa tu correo y tu contraseña.',changed:'Los datos cambiaron o vencieron. Actualiza y vuelve a intentarlo.',wait:'Espera un momento y vuelve a intentarlo.'}};return copy[document.documentElement.lang==='es'?'es':'fr'][key]||key}

function preferredLanguage(){try{const saved=localStorage.getItem('tacl-language');if(saved==='fr'||saved==='es')return saved}catch{}return typeof navigator!=='undefined'&&navigator.language?.startsWith('es')?'es':'fr'}function saveLanguage(value){try{localStorage.setItem('tacl-language',value)}catch{}}const words={fr:{title:'Choisir un nouveau mot de passe',password:'Nouveau mot de passe (12 caractères minimum)',confirm:'Confirmez le mot de passe',send:'Enregistrer le mot de passe',mismatch:'Les mots de passe ne correspondent pas.',invalid:'Lien invalide ou expiré. Demandez un nouveau lien.',success:'Votre mot de passe a été modifié. Reconnectez-vous avec le nouveau mot de passe.',error:'Modification non confirmée. Vérifiez Internet et réessayez.',again:'Recevoir un nouveau lien',driver:'Accès livreur',restaurant:'Demander une livraison'},es:{title:'Elige una nueva contraseña',password:'Nueva contraseña (mínimo 12 caracteres)',confirm:'Confirma la contraseña',send:'Guardar contraseña',mismatch:'Las contraseñas no coinciden.',invalid:'El enlace es inválido o venció. Solicita uno nuevo.',success:'Tu contraseña se cambió. Inicia sesión con la nueva contraseña.',error:'No pudimos confirmar el cambio. Revisa Internet y reintenta.',again:'Recibir un nuevo enlace',driver:'Acceso repartidores',restaurant:'Solicitar una entrega'}};const $=id=>document.getElementById(id);let lang=preferredLanguage();const t=k=>words[lang][k];function localize(){document.documentElement.lang=lang;localizeAccessibility();document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('lang').textContent=lang==='fr'?'Español':'Français'}$('lang').onclick=()=>{lang=lang==='fr'?'es':'fr';saveLanguage(lang);localize()};let resetToken=location.hash.slice(1);history.replaceState(null,'','/reset-password');$('form').onsubmit=async e=>{e.preventDefault();if($('password').value!==$('confirm').value){$('message').textContent=t('mismatch');return}
