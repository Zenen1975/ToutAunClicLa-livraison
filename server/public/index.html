<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ToutAunClicLa · Livraisons</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#292239;font:15px system-ui,sans-serif}header{background:white;border-bottom:1px solid #e8e2f0;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}h1{margin:0;color:#572794;font-size:23px}small{color:#726980}button,input,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #ddd5e9}button{background:#6332a0;color:white;cursor:pointer;border:0;font-weight:650}button.secondary{background:#eee7f7;color:#572794}button:disabled{opacity:.5}main{padding:26px 5%;max-width:1600px;margin:auto}.card{background:white;border:1px solid #e8e2f0;border-radius:18px;padding:22px;margin-bottom:20px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:22px}#map{height:500px;background:#f1edf7;border-radius:14px;display:grid;place-items:center;color:#726980}form{display:grid;gap:12px}#login{max-width:420px;margin:70px auto}#error{color:#a02b39;white-space:pre-wrap;min-height:24px}#pulse{margin:12px 0;color:#726980}.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #f0edf5}.tag{border-radius:20px;padding:5px 10px;display:inline-block;background:#eee7f7;color:#572794;font-size:12px}.tag.good{background:#e5f6ed;color:#1c7147}.tag.warn{background:#fff1dd;color:#8a591c}.metrics{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:22px}.metric{background:#fff;border:1px solid #e8e2f0;border-radius:14px;padding:18px;flex:1;min-width:150px}.metric strong{display:block;font-size:30px;color:#572794}.hidden{display:none!important}h2{font-size:19px}#deliveries p{margin:5px 0}a{color:#6332a0}.langs{display:flex;gap:8px}@media(max-width:850px){.layout{grid-template-columns:1fr}#map{height:350px}header{gap:12px;flex-wrap:wrap}}
</style>
<header><div><h1>ToutAunClicLa <small>· Livraisons</small></h1><small id="subtitle"></small></div><div class="langs"><button class="secondary" id="lang">ES</button><button id="logout" class="secondary hidden"></button></div></header>
<main><div id="error" role="alert"></div><section class="card" id="login"><h2 id="welcome"></h2><form id="loginForm"><label id="emailLabel" for="email"></label><input id="email" type="email" autocomplete="username" required><label id="passwordLabel" for="password"></label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton"></button></form></section>
<section id="dashboard" class="hidden"><div class="metrics"><div class="metric"><strong id="fresh">0</strong><span id="freshLabel"></span></div><div class="metric"><strong id="active">0</strong><span id="activeLabel"></span></div><div class="metric"><strong id="done">0</strong><span id="doneLabel"></span></div></div>
<div class="layout"><div><div class="card"><h2 id="mapTitle"></h2><div id="map"></div><div id="pulse" role="status"></div></div><div class="card"><h2 id="ordersTitle"></h2><div id="deliveries"></div></div></div>
<aside><div class="card"><h2 id="driversTitle"></h2><div id="drivers"></div></div><div class="card"><h2 id="assignTitle"></h2><form id="deliveryForm"><input id="pickup" maxlength="500" required><input id="destination" maxlength="500" required><select id="driverSelect" required></select><button id="assignButton"></button></form></div><div class="card"><h2 id="userTitle"></h2><form id="userForm"><input id="newName" maxlength="100" required><input id="newEmail" type="email" required><input id="newPassword" type="password" minlength="12" maxlength="200" autocomplete="new-password" required><button id="userButton"></button></form></div></aside></div></section></main>
<script>
let language='fr',token='',timer,map,markers=[],latestDrivers=[],latestDeliveries=[],refreshing=false,sessionEpoch=0;
const labels={fr:{subtitle:'Centre des opérations · Montréal et Rive-Sud',welcome:'Accès administrateur',emailLabel:'Courriel',passwordLabel:'Mot de passe',loginButton:'Se connecter',logout:'Se déconnecter',freshLabel:'GPS récents',activeLabel:'Livraisons en cours',doneLabel:'Livraisons terminées',mapTitle:'Carte des livreurs',ordersTitle:'Livraisons',driversTitle:'Équipe',assignTitle:'Assigner une livraison',assignButton:'Assigner',userTitle:'Créer un compte livreur',userButton:'Créer le compte',pickup:'Adresse de collecte',destination:'Adresse de livraison',newName:'Nom du livreur',newEmail:'Courriel du livreur',newPassword:'Mot de passe · 12 caractères minimum',empty:'Aucun résultat pour le moment.',noMap:'La carte Google Maps doit être configurée.',select:'Choisir un livreur disponible',updated:'Actualisé à ',stale:'Connexion interrompue. Données non actualisées.',available:'Disponible',offline:'Hors ligne',staleStatus:'GPS non actualisé',assigned:'Vers la collecte',picked_up:'En livraison',delivered:'Livrée',adminOnly:'Utilisez un compte administrateur.',mapsError:'Google Maps indisponible. Vérifiez la clé et la configuration.',accuracy:'Précision',last:'Dernier GPS',noGps:'Aucune position'},es:{subtitle:'Centro de operaciones · Montréal y Rive-Sud',welcome:'Acceso administrador',emailLabel:'Correo',passwordLabel:'Contraseña',loginButton:'Iniciar sesión',logout:'Cerrar sesión',freshLabel:'GPS recientes',activeLabel:'Entregas en curso',doneLabel:'Entregas terminadas',mapTitle:'Mapa de repartidores',ordersTitle:'Entregas',driversTitle:'Equipo',assignTitle:'Asignar una entrega',assignButton:'Asignar',userTitle:'Crear cuenta de repartidor',userButton:'Crear cuenta',pickup:'Dirección de recogida',destination:'Dirección de entrega',newName:'Nombre del repartidor',newEmail:'Correo del repartidor',newPassword:'Contraseña · mínimo 12 caracteres',empty:'Todavía no hay resultados.',noMap:'Falta configurar el mapa de Google Maps.',select:'Elegir repartidor disponible',updated:'Actualizado a las ',stale:'Conexión interrumpida. Datos sin actualizar.',available:'Disponible',offline:'Desconectado',staleStatus:'GPS desactualizado',assigned:'Hacia recogida',picked_up:'En entrega',delivered:'Entregada',adminOnly:'Usa una cuenta de administrador.',mapsError:'Google Maps no disponible. Revisa la clave y la configuración.',accuracy:'Precisión',last:'Último GPS',noGps:'Sin posición'}};
const $=id=>document.getElementById(id),t=key=>labels[language][key]||key;
function localize(){for(const k of Object.keys(labels.fr)){if($(k))$(k).textContent=t(k)}for(const k of ['pickup','destination','newName','newEmail','newPassword']){$(k).placeholder=t(k);$(k).setAttribute('aria-label',t(k))}document.documentElement.lang=language;$('lang').textContent=language==='fr'?'ES':'FR';if(!map)$('map').textContent=t('noMap');render();}
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(10000)});const p=await r.json();if(!r.ok){if(r.status===401&&path!='/login')reset();throw Error(p.error)}return p}
function reset(){sessionEpoch++;token='';clearInterval(timer);$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');$('login').classList.remove('hidden');latestDrivers=[];latestDeliveries=[];for(const m of markers)m.setMap(null);markers=[];render();}
function row(name,detail,status){const el=document.createElement('div');el.className='row';const text=document.createElement('div');const strong=document.createElement('strong');strong.textContent=name;text.append(strong);const small=document.createElement('small');small.style.display='block';small.textContent=detail;text.append(small);const tag=document.createElement('span');tag.className='tag '+(status==='available'?'good':status==='stale'?'warn':'');tag.textContent=t(status==='stale'?'staleStatus':status);el.append(text,tag);return el}
function render(){
 $('drivers').replaceChildren();$('deliveries').replaceChildren();const previous=$('driverSelect').value;$('driverSelect').replaceChildren(new Option(t('select'),''));
 for(const d of latestDrivers){const detail=d.lastUpdate?t('last')+': '+new Date(d.measuredAt).toLocaleTimeString()+' · '+t('accuracy')+': '+Math.round(d.accuracy)+' m':t('noGps');$('drivers').append(row(d.name,detail,d.status));if(d.fresh&&d.status==='available')$('driverSelect').add(new Option(d.name,d.id));}
 $('driverSelect').value=previous;
 for(const d of latestDeliveries){const driver=latestDrivers.find(x=>x.id===d.driver_id);$('deliveries').append(row(d.pickup+' → '+d.destination,driver?.name || '',d.status))}
 if(!latestDrivers.length)$('drivers').textContent=t('empty');if(!latestDeliveries.length)$('deliveries').textContent=t('empty');
 $('fresh').textContent=latestDrivers.filter(d=>d.fresh).length;$('active').textContent=latestDeliveries.filter(d=>d.status!=='delivered').length;$('done').textContent=latestDeliveries.filter(d=>d.status==='delivered').length;
 if(map){for(const m of markers)m.setMap(null);markers=[];for(const d of latestDrivers){if(d.latitude==null)continue;const position={lat:d.latitude,lng:d.longitude};const marker=new google.maps.Marker({map,position,title:d.name+' · '+t(d.status==='stale'?'staleStatus':d.status),opacity:d.fresh?1:.4});markers.push(marker);}}
}
async function refresh(){if(refreshing||!token)return;refreshing=true;const epoch=sessionEpoch;try{const [drivers,deliveries]=await Promise.all([api('/drivers'),api('/deliveries')]);if(epoch!==sessionEpoch)return;latestDrivers=drivers;latestDeliveries=deliveries;$('pulse').textContent=t('updated')+new Date().toLocaleTimeString();render();}catch(e){if(epoch===sessionEpoch){for(const d of latestDrivers){d.fresh=false;if(d.status!=='offline')d.status='stale'}render();$('pulse').textContent=t('stale');$('error').textContent=e.message}}finally{refreshing=false}}
async function loadMap(){if(map)return;const c=await api('/config');if(!c.mapsKey){$('map').textContent=t('noMap');return;}window.initMap=()=>{map=new google.maps.Map($('map'),{center:{lat:45.5019,lng:-73.5674},zoom:10,mapTypeControl:false});render()};window.gm_authFailure=()=>{$('map').textContent=t('mapsError')};const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(c.mapsKey)+'&callback=initMap&loading=async';s.onerror=()=>$('map').textContent=t('mapsError');document.head.append(s);}
async function submit(form,fn){const btn=form.querySelector('button');btn.disabled=true;$('error').textContent='';try{await fn()}catch(e){$('error').textContent=e.message}finally{btn.disabled=false}}
 $('loginForm').onsubmit=e=>{e.preventDefault();submit(e.currentTarget,async()=>{const result=await api('/login','POST',{email:$('email').value,password:$('password').value});if(result.user.role!=='admin')throw Error(t('adminOnly'));token=result.token;$('password').value='';$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');await refresh();timer=setInterval(refresh,12000);await loadMap()})};
 $('deliveryForm').onsubmit=e=>{e.preventDefault();submit(e.currentTarget,async()=>{await api('/deliveries','POST',{pickup:$('pickup').value,destination:$('destination').value,driverId:$('driverSelect').value});$('deliveryForm').reset();await refresh()})};
 $('userForm').onsubmit=e=>{e.preventDefault();submit(e.currentTarget,async()=>{await api('/users','POST',{name:$('newName').value,email:$('newEmail').value,password:$('newPassword').value});$('userForm').reset();await refresh()})};
 $('logout').onclick=async()=>{try{await api('/logout','POST',{})}finally{reset()}};$('lang').onclick=()=>{language=language==='fr'?'es':'fr';localize()};localize();
</script></html>
