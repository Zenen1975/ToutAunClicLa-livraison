 if(!latestRequests.length){target.textContent=t('empty');return}
 for(const r of latestRequests){
  const card=document.createElement('article');card.className='request-item';const heading=document.createElement('strong');heading.textContent=r.reference+' · '+r.requester_name;
  const tag=document.createElement('span');tag.className='tag';tag.textContent=t(r.delivery_status||r.status);card.append(heading,document.createTextNode(' '),tag);
  const line=(label,value,parent=card)=>{const p=document.createElement('p');p.textContent=label+': '+value;parent.append(p)};
  if(r.payment_state==='legacy')line('',t('legacy'));
  line(t('pickup'),r.pickup);line(t('destination'),r.destination);
  if(r.total_cents!=null)line(t('requestPrice'),money(r.total_cents+(r.gst_cents||0)+(r.qst_cents||0)+(r.tip_cents||0))+' · '+(r.distance_meters/1000).toLocaleString(language,{maximumFractionDigits:2})+' km · '+t('trafficRate')+': '+money(r.traffic_cents));
  if(r.total_cents!=null){line(t('fare'),money(r.total_cents));line('TPS (5 %)',money(r.gst_cents||0));line('TVQ (9,975 %)',money(r.qst_cents||0));line(t('tip'),money(r.tip_cents||0));}if(r.driver_payout_cents!=null){line(t('payout'),money(r.driver_payout_cents));line(t('commission'),money(r.commission_cents));}line(t('readyAt'),r.ready_at?new Date(r.ready_at).toLocaleString(language==='es'?'es-CA':'fr-CA',{timeZone:'America/Toronto'}):t('asap'));
  const details=document.createElement('details');details.dataset.request=r.id;details.open=opened.has(r.id);const summary=document.createElement('summary');summary.textContent=t('details');details.append(summary);
  line(t('contact'),[r.contact_name,r.contact_phone,r.contact_email].filter(Boolean).join(' · '),details);line(t('recipient'),r.recipient_name+' · '+r.recipient_phone,details);line(t('contents'),r.item_description,details);if(r.notes)line(t('notes'),r.notes,details);card.append(details);
  if(r.status==='pending'){
   if(r.payment_state==='paid')line('',t('refundNotice'));
   const form=document.createElement('form');form.className='request-actions';const select=document.createElement('select');select.required=true;select.dataset.request=r.id;select.setAttribute('aria-label',t('select'));select.add(new Option(t('select'),''));
   for(const d of latestDrivers)if(d.fresh&&(d.status==='available'||canJoin(d,r)))select.add(new Option(d.name+(d.status==='available'?'':' · '+t('joinBatch')+' '+d.batch.count+'/3'),d.id));select.value=chosen.get(r.id)||'';
   const button=document.createElement('button');button.textContent=t('assignButton');button.disabled=select.options.length===1;form.append(select,button);
   form.onsubmit=e=>{e.preventDefault();submit(form,async()=>{await api('/requests/'+r.id,'PATCH',{action:'assign',driverId:select.value,joinBatch:latestDrivers.find(d=>d.id===select.value)?.status!=='available'});await refresh()})};card.append(form);
   if(select.options.length===1)line('',t('noDriver'));
   const decline=document.createElement('button');decline.type='button';decline.className='secondary';decline.textContent=t('decline');decline.style.marginTop='12px';decline.onclick=async()=>{if(!window.confirm(t('declineConfirm')))return;decline.disabled=true;try{await api('/requests/'+r.id,'PATCH',{action:'decline'});await refresh()}catch(e){$('error').textContent=e.message}finally{decline.disabled=false}};card.append(decline);
  }
  target.append(card);
 }
}
function render(){renderRequests();renderActivity();
 $('drivers').replaceChildren();$('deliveries').replaceChildren();const previous=$('driverSelect').value;$('driverSelect').replaceChildren(new Option(t('select'),''));
 for(const d of latestDrivers){const detail=d.lastUpdate?t('last')+': '+new Date(d.measuredAt).toLocaleTimeString()+' · '+t('accuracy')+': '+Math.round(d.accuracy)+' m':t('noGps');$('drivers').append(row(d.name,detail,d.status));if(d.fresh&&d.status==='available')$('driverSelect').add(new Option(d.name,d.id));}
 $('driverSelect').value=previous;
 for(const d of latestDeliveries){const driver=latestDrivers.find(x=>x.id===d.driver_id);$('deliveries').append(row(d.pickup+' → '+d.destination,driver?.name || '',d.status))}
 if(!latestDrivers.length)$('drivers').textContent=t('empty');if(!latestDeliveries.length)$('deliveries').textContent=t('empty');
 $('fresh').textContent=latestDrivers.filter(d=>d.fresh).length;$('active').textContent=latestDeliveries.filter(d=>d.status!=='delivered').length;$('done').textContent=latestDeliveries.filter(d=>d.status==='delivered').length;
 if(map){for(const m of markers)m.setMap(null);markers=[];for(const d of latestDrivers){if(d.latitude==null)continue;const position={lat:d.latitude,lng:d.longitude};const marker=new google.maps.Marker({map,position,title:d.name+' · '+t(d.status==='stale'?'staleStatus':d.status),opacity:d.fresh?1:.4});markers.push(marker);}}
}
async function refresh(){if(refreshing||!token)return;refreshing=true;const epoch=sessionEpoch;try{const [drivers,deliveries,requests,activity]=await Promise.all([api('/drivers'),api('/deliveries'),api('/requests'),api('/admin/quote-activity')]);if(epoch!==sessionEpoch)return;latestDrivers=drivers;latestDeliveries=deliveries;latestRequests=requests;latestQuoteActivity=activity;notifyActivity();$('pulse').textContent=t('updated')+new Date().toLocaleTimeString();render();}catch(e){if(epoch===sessionEpoch){for(const d of latestDrivers){d.fresh=false;if(d.status!=='offline')d.status='stale'}render();$('pulse').textContent=t('stale');$('error').textContent=e.message}}finally{refreshing=false}}
async function loadMap(){if(map)return;const c=await api('/config');quotesConfigured=c.quotesConfigured;requestNotifications=c.requestNotifications||null;quoteNotifications=c.quoteNotifications||null;paymentsConfigured=c.paymentsConfigured===true;renderRequests();if(!c.mapsKey){$('map').textContent=t('noMap');return;}window.initMap=()=>{map=new google.maps.Map($('map'),{center:{lat:45.5019,lng:-73.5674},zoom:10,mapTypeControl:false});render()};window.gm_authFailure=()=>{$('map').textContent=t('mapsError')};const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(c.mapsKey)+'&callback=initMap&loading=async';s.onerror=()=>$('map').textContent=t('mapsError');document.head.append(s);}
async function submit(form,fn){const btn=form.querySelector('button');btn.disabled=true;$('error').textContent='';try{await fn()}catch(e){$('error').textContent=e.message}finally{btn.disabled=false}}
 $('loginForm').onsubmit=e=>{e.preventDefault();submit(e.currentTarget,async()=>{const result=await api('/login','POST',{email:$('email').value,password:$('password').value});if(result.user.role!=='admin'){await fetch('/logout',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+result.token},body:'{}'});throw Error(t('adminOnly'))}token=result.token;$('password').value='';$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');await refresh();timer=setInterval(refresh,12000);await loadMap()})};
const adminRouteFields=['pickup','destination','pickupPostalCode','destinationPostalCode'];
function adminRoute(){return Object.fromEntries(adminRouteFields.map(k=>[k,$(k).value.trim()]))}
function clearAdminQuote(){adminQuote=null;clearTimeout(adminQuoteTimer);$('adminAccept').checked=false;renderAdminQuote()}
function renderAdminQuote(){
 const box=$('adminQuote');box.replaceChildren();box.classList.toggle('hidden',!adminQuote);$('adminAcceptRow').classList.toggle('hidden',!adminQuote);
 $('assignButton').disabled=adminBusy||!adminQuote||!$('adminAccept').checked||adminQuote.expiresAt<=Date.now();
 if(!adminQuote)return;
 const q=adminQuote,tip=Number($('adminTip').value),commission=Math.round(q.subtotalCents/10);
 for(const [label,value]of [[t('distanceRate'),(q.distanceMeters/1000).toLocaleString(language,{maximumFractionDigits:2})+' km'],[t('fare'),money(q.subtotalCents)],[t('trafficRate'),money(q.trafficCents)],['TPS (5 %)',money(q.gstCents)],['TVQ (9,975 %)',money(q.qstCents)],[t('tip'),money(tip)],[t('adminTotal'),money(q.totalCents+tip)],[t('commission'),money(commission)],[t('adminDriver'),money(q.subtotalCents-commission+tip)]]){const line=document.createElement('p');line.textContent=label+': '+value;box.append(line)}
}
function setAdminBusy(busy){adminBusy=busy;for(const el of $('deliveryForm').querySelectorAll('input,select,button'))el.disabled=busy;renderAdminQuote()}
for(const key of adminRouteFields)$(key).oninput=clearAdminQuote;
$('adminAccept').onchange=renderAdminQuote;$('adminTip').onchange=()=>{$('adminAccept').checked=false;renderAdminQuote()};
$('calculateAdmin').onclick=async()=>{
 if(adminBusy||!adminRouteFields.every(k=>$(k).reportValidity()))return;
 clearAdminQuote();const epoch=sessionEpoch,route=adminRoute();setAdminBusy(true);$('error').textContent='';
 try{const q=await api('/admin/quotes','POST',route,25000);if(epoch!==sessionEpoch)return;adminQuote={...q,input:route};adminQuoteTimer=setTimeout(clearAdminQuote,Math.max(0,q.expiresAt-Date.now()));renderAdminQuote()}
 catch(e){if(epoch===sessionEpoch)$('error').textContent=e.message}finally{setAdminBusy(false)}
};
$('deliveryForm').onsubmit=async e=>{
 e.preventDefault();if(adminBusy)return;
 if(!adminQuote||!$('adminAccept').checked||adminQuote.expiresAt<=Date.now()||JSON.stringify(adminRoute())!==JSON.stringify(adminQuote.input)){clearAdminQuote();$('error').textContent=t('adminQuoteExpired');return}
 const epoch=sessionEpoch,payload={...adminQuote.input,quoteId:adminQuote.quoteId,acceptPrice:true,tipCents:Number($('adminTip').value),driverId:$('driverSelect').value};setAdminBusy(true);$('error').textContent='';
 try{await api('/deliveries','POST',payload);if(epoch!==sessionEpoch)return;clearAdminQuote();$('deliveryForm').reset();await refresh()}
 catch(e){if(epoch===sessionEpoch)$('error').textContent=e.message}finally{setAdminBusy(false)}
};
function accountType(){const restaurant=$('newRole').value==='restaurant';$('restaurantFields').classList.toggle('hidden',!restaurant);$('newPickup').required=restaurant;$('newPostal').required=restaurant}
 $('newRole').onchange=accountType;accountType();
 $('userForm').onsubmit=e=>{e.preventDefault();submit(e.currentTarget,async()=>{await api('/users','POST',{name:$('newName').value,email:$('newEmail').value,password:$('newPassword').value,role:$('newRole').value,pickup:$('newPickup').value,pickupPostalCode:$('newPostal').value});$('userForm').reset();accountType();$('userResult').textContent=t('accountCreated');await refresh()})};
 $('emailCheck').onclick=async()=>{
   const button=$('emailCheck'),epoch=sessionEpoch;
   button.disabled=true;$('emailResult').textContent=t('emailChecking');
   try{
     const result=await api('/email/check','POST',{},25000);
     if(epoch!==sessionEpoch)return;
     requestNotifications=result.requestNotifications||null;renderRequests();
     $('emailResult').textContent=t(result.code)+(result.missing?' '+result.missing.join(', '):'')+
       (result.queue?'\n'+t('emailCounts')+': '+[result.queue.sent||0,result.queue.pending||0,result.queue.failed||0].join(' / '):'')+
       (result.requestNotifications?.queue?'\n'+t('requestEmailCounts')+': '+[result.requestNotifications.queue.sent||0,result.requestNotifications.queue.pending||0,result.requestNotifications.queue.failed||0].join(' / '):'');
   }catch(e){if(epoch===sessionEpoch)$('emailResult').textContent=e.name==='TimeoutError'?t('email_network'):e.message;}
   finally{button.disabled=false;}
 };
 $('logout').onclick=async()=>{try{await api('/logout','POST',{})}finally{reset()}};$('lang').onclick=()=>{language=language==='fr'?'es':'fr';localize()};localize();
</script></html>
