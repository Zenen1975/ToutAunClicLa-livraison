function localize(){document.documentElement.lang=lang;localizeAccessibility();document.querySelectorAll('[data-prohibited-link]').forEach(e=>e.href='/terms/2026-10-23-v2#'+lang+'-prohibited');document.querySelectorAll('[data-i18n=termsLink]').forEach(e=>e.href='/terms/2026-10-23-v2#'+lang);document.documentElement.lang=lang;document.title='ToutAunClicLa · '+t('space');document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('language').textContent=lang==='fr'?'Español':'Français';if(sending)$('send').textContent=t('sending');else if(acceptedBody)$('send').textContent=t('retry');renderQuote();renderStatus();renderTip();showStep(currentStep,false)}
function invalidateQuote(){if(acceptedBody)return;quote=null;clearTimeout(quoteTimer);$('quoteCard').classList.add('hidden');$('send').classList.add('hidden');$('acceptPrice').checked=false;$('acceptPrice').required=false;$('acceptTerms').required=false;$('acceptTerms').checked=false;$('calculate').classList.remove('hidden')}

function renderQuote(){if(!quote)return;const tip=Number($('tipCents').value||0),total=quote.totalCents+tip;$('price').textContent=money(total);$('quoteDetails').style.whiteSpace='pre-line';$('quoteDetails').textContent=[t('subtotal')+': '+money(quote.subtotalCents),t('gst')+': '+money(quote.gstCents),t('qst')+': '+money(quote.qstCents),t('tip')+': '+money(tip),t('grandTotal')+': '+money(total)].join('\n');$('quoteRouteDetails').style.whiteSpace='pre-line';$('quoteRouteDetails').textContent=[t('distance')+': '+(quote.distanceMeters/1000).toLocaleString(lang,{maximumFractionDigits:2})+' km · '+t('duration')+': '+Math.ceil(quote.durationSeconds/60)+' min',t('baseline')+': '+Math.ceil(quote.baselineSeconds/60)+' min · '+t('delay')+': '+Math.floor(quote.delaySeconds/60)+' min',t('distancePrice')+': '+money(quote.distanceCents),t('trafficPrice')+': '+money(quote.trafficCents)].join('\n');$('quoteExpiry').textContent=t('expires')+new Date(quote.expiresAt).toLocaleTimeString();$('acceptLabel').textContent=t('accept')+money(total);$('routePreview').href='https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+encodeURIComponent(quote.pickup)+'&destination='+encodeURIComponent(quote.destination);updateReview()}

async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',...(restaurantAuth?{Authorization:'Bearer '+restaurantAuth}:{})},body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});const data=await r.json();if(!r.ok){const e=Error(serviceError(data,r.status));e.status=r.status;throw e}return data}

$('calculate').onclick=async()=>{
 if(sending||!validateRequest())return;const btn=$('calculate');btn.disabled=true;btn.textContent=t('calculating');$('error').textContent='';
 try{const body=formBody();const snapshot=JSON.stringify([body.pickup,body.destination,body.pickupPostalCode,body.destinationPostalCode,body.readyAt]);const result=await post('/quotes',body);const now=formBody();if(snapshot!==JSON.stringify([now.pickup,now.destination,now.pickupPostalCode,now.destinationPostalCode,now.readyAt]))return;quote=result;renderQuote();$('quoteCard').classList.remove('hidden');$('acceptTerms').required=true;$('acceptTerms').checked=false;$('acceptPrice').required=true;$('acceptPrice').checked=false;$('send').classList.remove('hidden');btn.classList.add('hidden');clearTimeout(quoteTimer);quoteTimer=setTimeout(()=>{if(!acceptedBody){invalidateQuote();$('error').textContent=t('expired')}},Math.max(0,quote.expiresAt-Date.now()));$('quoteCard').scrollIntoView({behavior:'smooth',block:'center'})}

};
$('requestForm').onsubmit=async e=>{
 e.preventDefault();if(sending)return;if(!acceptedBody&&currentStep<3){advanceStep(currentStep+1);return}if(!acceptedBody&&!validateRequest())return;if(!acceptedBody&&(!quote||!$('acceptPrice').checked)){ $('error').textContent=t('needQuote');return}

 try{
  if(!acceptedBody)acceptedBody={...formBody(),submissionId,statusToken,quoteId:quote.quoteId,acceptPrice:true};lockFields(true);

 }catch(err){if(err.status&&err.status<500){acceptedBody=null;lockFields(false);if(err.status===409){invalidateQuote();submissionId=crypto.randomUUID();statusToken=makeToken()}$('error').textContent=err.message}else $('error').textContent=err.status?err.message:t('locked')}
 finally{sending=false;$('send').disabled=false;$('send').textContent=t(acceptedBody?'retry':'send');updateReview()}
};
function renderStatus(){if(!tracking)return;$('reference').textContent=tracking.reference;if(lastStatus){$('resumePayment').classList.toggle('hidden',!lastStatus.checkoutUrl);if(lastStatus.checkoutUrl&&lastStatus.checkoutUrl.startsWith('https://checkout.stripe.com/'))$('resumePayment').href=lastStatus.checkoutUrl;$('trackingMessage').textContent=t(lastStatus.status)+(lastStatus.driverName?' '+t('driverName')+lastStatus.driverName:'');$('trackingPrice').textContent=t('fixedPrice')+money(lastStatus.totalCents)+' · '+t('gst')+': '+money(lastStatus.gstCents||0)+' · '+t('qst')+': '+money(lastStatus.qstCents||0)}}
async function checkStatus(){if(!tracking||statusBusy)return;statusBusy=true;const current=tracking;try{const r=await fetch('/request-status/'+current.id,{headers:{Authorization:'Bearer '+current.token},signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error();const data=await r.json();if(current!==tracking)return;lastStatus=data;renderStatus();$('trackingSync').textContent=t('lastUpdate')+new Date().toLocaleTimeString();if(['delivered','declined'].includes(data.status))clearInterval(statusTimer)}catch{if(current===tracking)$('trackingSync').textContent=t('statusError')}finally{statusBusy=false}}
