async function checkStatus(){if(!tracking||statusBusy)return;statusBusy=true;const current=tracking;try{const r=await fetch('/request-status/'+current.id,{headers:{Authorization:'Bearer '+current.token},signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error();const data=await r.json();if(current!==tracking)return;lastStatus=data;renderStatus();$('trackingSync').textContent=t('lastUpdate')+new Date().toLocaleTimeString();if(['delivered','declined'].includes(data.status))clearInterval(statusTimer)}catch{if(current===tracking)$('trackingSync').textContent=t('statusError')}finally{statusBusy=false}}
function showTracking(){clearTimeout(quoteTimer);$('requestForm').classList.add('hidden');$('success').classList.remove('hidden');$('success').focus();location.hash=tracking.id+'.'+tracking.token;try{if(!restaurantAuth)localStorage.setItem('tacl-last-request',JSON.stringify(tracking))}catch{}renderStatus();clearInterval(statusTimer);void checkStatus();statusTimer=setInterval(checkStatus,12000)}
$('checkStatus').onclick=checkStatus;
$('another').onclick=()=>{clearInterval(statusTimer);tracking=null;lastStatus=null;acceptedBody=null;lockFields(false);$('requestForm').reset();$('tipCents').value='0';renderTip();schedule();submissionId=crypto.randomUUID();statusToken=makeToken();$('success').classList.add('hidden');$('requestForm').classList.remove('hidden');$('error').textContent='';history.replaceState(null,'',location.pathname);try{localStorage.removeItem('tacl-last-request')}catch{}void fillRestaurant();$('requesterName').focus()};
localize();void fillRestaurant();
const fragment=/^#([a-f0-9]{48})\.([a-f0-9]{64})$/.exec(location.hash);
if(fragment){tracking={id:fragment[1],token:fragment[2],reference:'TAC-'+fragment[1].slice(0,12).toUpperCase()};showTracking()}
else if(!restaurantAuth&&!/(?:^|[?&])new=1(?:&|$)/.test(location.search||'')){try{const saved=JSON.parse(localStorage.getItem('tacl-last-request'));if(saved&&/^[a-f0-9]{48}$/.test(saved.id)&&/^[a-f0-9]{64}$/.test(saved.token)){tracking=saved;showTracking()}}catch{}}
